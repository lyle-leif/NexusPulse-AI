services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexuspulse
      POSTGRES_PASSWORD: nexuspulse_dev
      POSTGRES_DB: nexuspulse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro

volumes:
  pgdata:
